name: Project checks

on:
  push:
    branches: [main, feature/game-room-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test timer and prayer calculations
        run: python tests/run_tests.py
      - name: Check interface wiring
        run: |
          python tests/check_ui.py
          python tests/check_scene.py
      - name: Verify offline audio assets and mix headroom
        run: python tests/check_audio.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/room.js
          node --check assets/game-room.js
      - name: Exercise the game room and fallback interfaces
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sakin-browser/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/sakin-browser" playwright@1.56.1
          "$RUNNER_TEMP/sakin-browser/node_modules/.bin/playwright" install --with-deps chromium
          node tests/browser_game.cjs
          node tests/browser_ui.cjs
          node tests/browser_rooms.cjs
